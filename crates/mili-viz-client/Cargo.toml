[package]
name = "mili-viz-client"
version = "0.0.0"
description = "Phase 5 M1 mili-viz client: wgpu renderer skeleton (window, orbit camera, hard-coded triangle)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mili-viz-client"
path = "src/main.rs"

[dependencies]
wgpu = "29"
winit = "0.30"
glam = "0.32"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
egui = "0.34.2"
egui_plot = "0.35.0"
egui-wgpu = "0.34.2"
egui-winit = { version = "0.34.2", default-features = false }
mili-viz-proto = { path = "../mili-viz-proto" }
mili-viz-server = { path = "../mili-viz-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
glam = "0.32"
egui = "0.34.2"
mili-viz-proto = { path = "../mili-viz-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
