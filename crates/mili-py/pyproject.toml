[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "milox"
version = "0.0.0"
description = "Rust-backed, API-compatible reimplementation of the mili reader"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3.11",
]

[tool.maturin]
# The Rust cdylib is the private extension `milox._native`; the
# importable package `milox` lives under `python/` and re-exports it.
module-name = "milox._native"
python-source = "python"
manifest-path = "Cargo.toml"
