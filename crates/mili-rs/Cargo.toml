[package]
name = "mili-rs"
version = "0.0.0"
description = "Pure-Rust reader and writer for LLNL MDG mili databases."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = "1"
memmap2 = "0.9"
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "read"
harness = false
