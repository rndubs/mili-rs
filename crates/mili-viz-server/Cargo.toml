[package]
name = "mili-viz-server"
version = "0.0.0"
description = "Phase 4 mili-viz server: in-process MiliViz transport, dispatch + broadcast, mili-rs-backed geometry."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mili-viz-proto = { path = "../mili-viz-proto" }
mili-rs = { path = "../mili-rs" }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tower = "0.5"
hyper-util = "0.1"

[dev-dependencies]
mili-viz-proto = { path = "../mili-viz-proto" }
prost = "0.14"
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
tokio-stream = "0.1"

[lints]
workspace = true
