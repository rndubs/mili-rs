# mili-llm-bench — v0 baseline harness for the local-LLM agent track.
#
# Drives one defensible number (stock FunctionGemma-270M-it's L3
# success rate on a 50-scenario bootstrap eval) per
# planning/mili-viz/agent-local-llm-baseline.md. Off the Phase 4/5/6
# critical path; capability-gated via the frozen AgentChat surface.
#
# PR-3 added W4a (the factored agent harness) + W5 partial
# (MockLlmProvider + ReplayLlmProvider). PR-5 finishes W5 (FunctionGemma
# + Anthropic providers behind their own extras) and lands W6 (the
# `run` / `replay` CLI subcommands + `report.md` generator).
#
# Always-on test path (CI default) imports neither `transformers` /
# `torch` / `anthropic` nor `pygriz`. The heavy providers each live
# behind an optional-dependency extra; the pygriz dispatcher factory
# stays behind the [pygriz] extra.

[project]
name = "mili-llm-bench"
version = "0.0.0"
description = "Bench harness for the mili-viz local-LLM agent v0 baseline"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
  "jsonschema>=4.20",
  "protobuf>=4.25",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
# Optional — needed only by `mili_llm_bench.dispatchers.pygriz`. The
# always-on harness tests run with FakeDispatcher and do NOT require
# this extra.
pygriz = [
  "pygriz @ file:///Users/rwhit/Workspace/mili-rs/python/pygriz",
]
# Optional — needed only by `mili_llm_bench.providers.functiongemma`.
# `accelerate` is the documented runtime for FunctionGemma-270M-it per
# its model card; `transformers` carries the chat-template path; `torch`
# is the inference runtime. Heavy by intent — the v0 baseline runs on
# CPU but a GPU box is faster.
functiongemma = [
  "transformers>=4.50",
  "torch>=2.2",
  "accelerate>=0.30",
]
# Optional — needed only by `mili_llm_bench.providers.anthropic`. The
# frontier-baseline provider; `anthropic` is the official SDK.
anthropic = [
  "anthropic>=0.40",
]
# Optional — needed only by `mili_llm_bench.providers.llamacpp`. The
# runtime requirement is that `llama-server` is on $PATH (from
# https://github.com/ggml-org/llama.cpp). The Python extra is empty
# (no package deps), but requests is needed for HTTP calls.
llamacpp = [
  "requests>=2.31",
]

[project.scripts]
mili-llm-bench = "mili_llm_bench.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
