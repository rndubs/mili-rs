# mili-llm-bench — v0 baseline harness for the local-LLM agent track.
#
# Drives one defensible number (stock FunctionGemma-270M-it's L3
# success rate on a 50-scenario bootstrap eval) per
# planning/mili-viz/agent-local-llm-baseline.md. Off the Phase 4/5/6
# critical path; capability-gated via the frozen AgentChat surface.
#
# PR-3 adds W4a (the factored agent harness) + W5 partial
# (MockLlmProvider + ReplayLlmProvider — FunctionGemma + Anthropic
# providers land in PR-5 with their own extras). The pygriz adapter
# (the only file in the package that imports `pygriz`) lives behind
# the [pygriz] extra so the always-on test path (W1+W2+W3+W4a) stays
# GPU-free / server-free / pygriz-free in CI.

[project]
name = "mili-llm-bench"
version = "0.0.0"
description = "Bench harness for the mili-viz local-LLM agent v0 baseline"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
  "jsonschema>=4.20",
  "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
# Optional — needed only by `mili_llm_bench.dispatchers.pygriz`. The
# always-on harness tests run with FakeDispatcher and do NOT require
# this extra.
pygriz = [
  "pygriz",
]

[project.scripts]
mili-llm-bench = "mili_llm_bench.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
