name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly fuzz cron at 07:00 UTC (low-traffic hour). Only the
    # `fuzz` job below runs on this trigger.
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch top-level submodules (reference/mili, reference/mili-python,
          # reference/griz). We do not recurse: the nested mdgtest submodule
          # under reference/mili/test/ is on an LLNL-internal SSH host that
          # GitHub runners cannot reach.
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch top-level submodules (reference/mili, reference/mili-python,
          # reference/griz). We do not recurse: the nested mdgtest submodule
          # under reference/mili/test/ is on an LLNL-internal SSH host that
          # GitHub runners cannot reach.
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # `mili-py` is excluded here so the fast test job never links
      # pyo3; it has its own `test-milox` job below.
      - run: cargo test --workspace --exclude mili-py

  test-parity:
    # Cross-impl parity vs. mili-python. Runs the `parity` feature
    # tests in `crates/mili-rs/tests/parity_*.rs` plus the xmilics /
    # full-corpus suites (skip-not-fail when the corpus or python
    # package is absent at runtime, but here we always install both
    # via the shared setup script).
    #
    # Hard gate (corpus-coverage): the parity suite includes
    # `parity_corpus_coverage.rs` — because this step runs
    # `scripts/setup-parity.sh` (inits both submodules) before
    # `cargo test --features parity`, the parity environment is present,
    # so that guard asserts every on-disk corpus family is
    # exercised+accounted and no accounted family silently vanished. The
    # per-family skip-on-absent convention (the rest of the parity
    # suites) is preserved; this guard turns "a family quietly
    # disappeared / a new upstream family nothing references" — the
    # remaining silent-rot path — into a hard CI failure here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Single source of truth shared with the session-start hook and
      # local devs — keeps the parity environment identical everywhere.
      - name: Set up parity environment
        run: scripts/setup-parity.sh
      - run: cargo test --workspace --exclude mili-py --features parity

  test-milox:
    # Dedicated job for the pyo3 binding crate (mirrors test-parity's
    # Python/maturin setup). Builds `milox` via maturin and runs the
    # pytest parity harness (import milox vs upstream mili) on the
    # parity corpus + xmilics multi-fragment families. Skip-not-fail
    # when the corpus / oracle is absent, same as the Rust parity jobs.
    #
    # Hard gate (closeout, redirect-coverage): the harness includes
    # `test_redirect_coverage_is_exhaustive` (every upstream
    # reference/mili-python/tests/test_*.py is redirected-and-promoted
    # or consciously EXCLUDED) and a strict 0-xfail
    # `pytest_sessionfinish` check in conftest.py (any xfail/xpass fails
    # the session). So this step enforces "every upstream read-path test
    # promoted, 0 xfail" with no tolerance — a future submodule bump
    # adding an unredirected test_*.py, or a silently-diverging case,
    # fails CI here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Single source of truth: installs the upstream `mili` oracle and
      # inits the reference/mili (xmilics) + reference/mili-python
      # submodules used by the harness.
      - name: Set up parity environment
        run: scripts/setup-parity.sh
      - name: Build + install milox
        # pip drives the maturin build backend (pyproject.toml) with
        # build isolation — no virtualenv needed on the runner.
        run: pip install pytest ./crates/mili-py
      - name: Parity harness
        run: pytest -q crates/mili-py/tests

  fuzz:
    # Long-running cargo-fuzz cron. Each target runs for 30 minutes on
    # nightly Rust (libfuzzer-sys's link step is nightly-only). Not a
    # PR merge gate — only triggers on the nightly schedule above or a
    # manual `workflow_dispatch`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [header, directory, param]
    env:
      # libfuzzer-sys + nightly emit benign warnings we don't want to
      # treat as errors in this job.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          rustflags: ""
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} (30 min)
        working-directory: crates/mili-rs/fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=1800
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/mili-rs/fuzz/artifacts/
